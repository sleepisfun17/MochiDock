# Builds MochiDock and runs the unit tests on every push to main and every pull request.
# The app is never launched here (it needs Administrator and a desktop session); the render harnesses in tools/verify stay local.
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE', 'THIRD-PARTY-NOTICES.txt']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'LICENSE', 'THIRD-PARTY-NOTICES.txt']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Build the app
        run: dotnet build MochiDock/MochiDock.csproj -c Release

      - name: Run the tests
        run: dotnet test MochiDock.Tests/MochiDock.Tests.csproj -c Release --logger "trx;LogFileName=results.trx"

      - name: Keep the test results
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: MochiDock.Tests/TestResults/
